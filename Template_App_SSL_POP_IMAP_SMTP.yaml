      name: IMAP service performance
      type: SIMPLE
      key: net.tcp.service.perf[imap]
      delay: 1m
      history: 1w
      value_type: FLOAT
      units: s
      trends: 365d
      tags:
      - tag: Application
        value: IMAP service
    - uuid: 9afdbd9c0d3d471e88fc7f7583b4eb11
      name: IMAP service is running
      type: SIMPLE
      key: net.tcp.service[imap]
      delay: 1m
      history: 1w
      value_type: UNSIGNED
      trends: 365d
      valuemap:
        name: Service state
      tags:
      - tag: Application
        value: IMAP service
      triggers:
      - uuid: f9de74280a924f5ea77a011c963ea67e
        expression: max(/Template App IMAP Service/net.tcp.service[imap],#3)=0
        name: IMAP service is down on {HOST.NAME}
        priority: AVERAGE
    - uuid: 9c73396d071f486397d210dc39f938b4
