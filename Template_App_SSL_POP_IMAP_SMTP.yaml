      type: EXTERNAL
      key: ssltls.check[{HOST.CONN}:143,imap,digestmode]
      delay: 1h
      history: 90d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: Application
        value: IMAP service
      triggers:
      - uuid: 588fdc206ef147f298c8b2a4e11c2635
        expression: find(/Template App IMAP Service/ssltls.check[{HOST.CONN}:143,imap,digestmode],,"like","sha1")=1 or find(/Template App IMAP Service/ssltls.check[{HOST.CONN}:143,imap,digestmode],,"like","md5")=1
